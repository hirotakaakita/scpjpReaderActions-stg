name: Validate staging
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'hirotakaakita/scpjpReaderActions-stg'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: npm ci
      - run: node --test
      - name: Validate catalog and staging status
        run: node validate-staging-catalogs.js
  firebase:
    needs: validate
    runs-on: ubuntu-latest
    environment: stg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Validate staging FCM authentication without sending a notification
        run: node check-staging-firebase.js
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.STG_FIREBASE_SERVICE_ACCOUNT_JSON }}
