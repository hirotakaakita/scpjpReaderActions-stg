name: Validate staging
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'hirotakaakita/scpjpReaderActions-stg'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: node --test
      - name: Validate catalog and staging status
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const assert = require('assert/strict');
          const { LANGUAGES } = require('./languages');
          for (const lang of Object.keys(LANGUAGES)) {
            const data = JSON.parse(fs.readFileSync(`local-data/${lang}/scp-data.json`));
            assert(data.data.length > 0, `Empty catalog: ${lang}`);
            JSON.parse(fs.readFileSync(`local-data/${lang}/meta.json`));
          }
          const status = JSON.parse(fs.readFileSync('app-status.json'));
          assert.equal(status.androidStoreUrl, '');
          assert.equal(status.maintenance, false);
          console.log('Validated all language catalogs and staging status');
          NODE
