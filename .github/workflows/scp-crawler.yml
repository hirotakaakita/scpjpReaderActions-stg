name: SCP Crawler STG

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      repair_excerpts_only:
        description: 'Audit all languages and completely repair existing excerpts without a full site crawl'
        type: boolean
        default: false
      excerpt_repair_run:
        description: 'Optional earlier repair run ID whose completed results can be reused'
        type: string
        default: ''
      additional_sites_only:
        description: "Crawl only the 16 newly added viewing languages"
        required: false
        default: false
        type: boolean
      force_refresh_scp_details:
        description: "Force refresh SCP object classes and excerpts"
        required: false
        default: false
        type: boolean
      force_refresh_object_class:
        description: "Force refresh all SCP object classes"
        required: false
        default: false
        type: boolean
      force_refresh_description:
        description: "Force refresh all SCP description excerpts"
        required: false
        default: false
        type: boolean
      force_refresh_tags:
        description: "Force refresh all SCP tags"
        required: false
        default: false
        type: boolean

concurrency:
  group: scp-crawl
  cancel-in-progress: false
  queue: max

jobs:
  # languages.jsから全言語×全ページのmatrixを生成する
  setup:
    if: github.repository == 'hirotakaakita/scpjpReaderActions-stg' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Check public tag filtering
        run: node --test test/public-tags.test.js test/tag-dictionary.test.js test/rufoundation-crawler.test.js

      - name: Validate tag dictionary
        run: node -e "require('./tag-dictionary').readDictionary('tag-dictionary.json')"

      - name: Validate additional branch sites and namespace routing
        run: node --test test/additional-sites.test.js

      - name: Check article metadata and series classification
        run: node --test test/article-images.test.js test/image-policy.test.js test/crawler-tag-refresh.test.js test/series-listing.test.js test/scp-archive-classification.test.js test/russian-joke-classification.test.js test/russian-archive-classification.test.js test/scp-document-identity.test.js test/related-documents.test.js test/refresh-document-metadata.test.js test/article-excerpts.test.js test/excerpt-repair.test.js

      - name: Generate matrix
        id: matrix
        run: echo "matrix=$(node print-matrix.js)" >> "$GITHUB_OUTPUT"
        env:
          ADDITIONAL_SITES_ONLY: ${{ inputs.additional_sites_only == true && '1' || '0' }}
          REPAIR_EXCERPTS_ONLY: ${{ inputs.repair_excerpts_only == true && '1' || '0' }}

  crawl:
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 360
    strategy:
      fail-fast: false # 1ページの失敗で他ページのクロールを止めない
      max-parallel: 5 # Wikidot???????????
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # local-data/<lang>/scp-data.json（checkout済み）を参照して
      # createdAt・取得済み画像URLを引き継ぐ差分クロール
      # 並列実行のためエントリ間の待機を1000msに延長（レート制限対策）
      - name: Crawl ${{ matrix.lang }} site
        if: inputs.repair_excerpts_only != true
        run: node language-crawler.js ${{ matrix.lang }}
        env:
          CRAWL_DELAY_MS: '1000'
          CRAWL_ENTRY_CONCURRENCY: '2'
          CRAWL_REQUEST_INTERVAL_MS: '500'
          FORCE_REFRESH_SCP_DETAILS: ${{ inputs.force_refresh_scp_details == true && '1' || '0' }}
          FORCE_REFRESH_OBJECT_CLASS: ${{ inputs.force_refresh_object_class == true && '1' || '0' }}
          FORCE_REFRESH_DESCRIPTION: ${{ inputs.force_refresh_description == true && '1' || '0' }}
          FORCE_REFRESH_TAGS: ${{ inputs.force_refresh_tags == true && '1' || '0' }}

      - name: Discover article URLs from official indexes
        if: inputs.repair_excerpts_only != true
        continue-on-error: true
        run: node catalog-indexes.js ${{ matrix.lang }}
        env:
          INDEX_MAX_REQUESTS: '0'
          INDEX_MAX_DURATION_MS: '3600000'
          FORCE_REFRESH_ARTICLE_INDEXES: '1'
          CRAWL_REQUEST_INTERVAL_MS: '500'

      - name: Refresh body links between existing catalog members
        if: inputs.repair_excerpts_only != true
        run: node research-board/refresh-links.js ${{ matrix.lang }}
        env:
          BOARD_LINK_MAX_REQUESTS: '600'
          BOARD_LINK_MAX_DURATION_MS: '300000'
          CRAWL_REQUEST_INTERVAL_MS: '500'

      - name: Refresh identity metadata for unresolved collected translations
        if: inputs.repair_excerpts_only != true
        run: node research-board/refresh-identities.js ${{ matrix.lang }}
        env:
          IDENTITY_MAX_REQUESTS: '150'
          IDENTITY_MAX_DURATION_MS: '180000'

      - name: Refresh attribution formats for unresolved articles
        if: inputs.repair_excerpts_only != true
        continue-on-error: true
        run: node tool/refresh-attribution-evidence.js ${{ matrix.lang }}
        env:
          ATTRIBUTION_MAX_REQUESTS: '40'
          ATTRIBUTION_MAX_DURATION_MS: '120000'

      - name: Resolve original sources from interwiki metadata
        if: inputs.repair_excerpts_only != true
        continue-on-error: true
        run: node tool/enrich-origin-evidence.js ${{ matrix.lang }}
        env:
          ORIGIN_EVIDENCE_MAX_PAGES: '600'
          ORIGIN_EVIDENCE_MAX_DURATION_MS: '180000'

      - name: Upload partial data
        if: always() && inputs.repair_excerpts_only != true
        uses: actions/upload-artifact@v7
        with:
          name: partial-${{ matrix.lang }}
          path: partial-data/
          retention-days: 3
          if-no-files-found: error

  # Separate discovery and full text retrieval so each has its own time budget.
  refresh-article-text:
    runs-on: ubuntu-latest
    needs: [setup, crawl]
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download current language crawl data
        if: inputs.repair_excerpts_only != true
        uses: actions/download-artifact@v7
        with:
          name: partial-${{ matrix.lang }}
          path: partial-data

      - name: Restore earlier excerpt repair checkpoints
        id: restore_text_checkpoint
        if: inputs.repair_excerpts_only == true && inputs.excerpt_repair_run != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          repository: hirotakaakita/scpjpReaderActions-stg
          run-id: ${{ inputs.excerpt_repair_run }}
          github-token: ${{ github.token }}
          name: article-text-${{ matrix.lang }}
          path: excerpt-previous/excerpt-repairs

      - name: Restore checkpoints from workflows before the job split
        if: inputs.repair_excerpts_only == true && inputs.excerpt_repair_run != '' && steps.restore_text_checkpoint.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          repository: hirotakaakita/scpjpReaderActions-stg
          run-id: ${{ inputs.excerpt_repair_run }}
          github-token: ${{ github.token }}
          name: partial-${{ matrix.lang }}
          path: excerpt-previous

      - name: Refresh titles and excerpts for every article kind
        run: node tool/refresh-article-text.js ${{ matrix.lang }}
        env:
          EXCERPT_MAX_REQUESTS: '100000'
          EXCERPT_REQUIRE_COMPLETE: '1'
          CRAWL_REQUEST_INTERVAL_MS: '500'
          EXCERPT_PREVIOUS_REPAIRS: excerpt-previous/excerpt-repairs/${{ matrix.lang }}.json.gz

      - name: Upload article text checkpoints
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: article-text-${{ matrix.lang }}
          path: partial-data/excerpt-repairs/
          retention-days: 3
          if-no-files-found: error

  # Publish only when discovery and full text retrieval both succeeded.
  merge-and-deploy:
    concurrency:
      group: scp-data-update
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    needs: [setup, crawl, refresh-article-text]
    if: always() && needs.setup.result == 'success' && needs.crawl.result == 'success' && needs.refresh-article-text.result == 'success' && github.repository == 'hirotakaakita/scpjpReaderActions-stg' && github.ref == 'refs/heads/master'
    environment: stg
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download all partial data
        if: inputs.repair_excerpts_only != true
        uses: actions/download-artifact@v7
        with:
          pattern: partial-*
          path: partial-data
          merge-multiple: true

      - name: Download all article text results
        uses: actions/download-artifact@v7
        with:
          pattern: article-text-*
          path: partial-data/excerpt-repairs
          merge-multiple: true

      - name: Test localized catalog generation
        run: node --test test/tag-catalog.test.js test/crawler-tag-refresh.test.js test/catalog-identity.test.js test/apply-manga-flags.test.js test/staging-catalogs.test.js test/rufoundation-crawler.test.js test/russian-labels-images.test.js

      - name: Prepare tag dictionary before catalog generation
        run: node prepare-tag-dictionary.js

      - name: Merge partial data into local-data
        if: inputs.repair_excerpts_only != true
        run: node merge-data.js

      - name: Apply manga availability flags
        run: node apply-manga-flags.js

      - name: Apply excerpt repairs to sources and retained caches
        run: node tool/apply-excerpt-repairs.js
        env:
          EXCERPT_REQUIRE_COMPLETE: '1'

      - name: Reject duplicate article IDs before publication
        run: node catalog-identity.js

      - name: Validate staging catalog schema before publication
        run: node validate-staging-catalogs.js

      - name: Merge catalogs collected from official article indexes
        run: |
          node --test test/catalog-indexes.test.js test/article-page.test.js test/reviewed-article-classifications.test.js
          node merge-catalog-indexes.js
          node validate-catalog-indexes.js

      - name: Generate combined compatible mobile catalogs
        run: |
          node --test test/mobile-catalog.test.js test/research-board.test.js
          node mobile-catalog.js
          node research-board/validate.js

      # Compare against the latest master acquired after entering the publish lock.
      - name: Prepare notification queue
        if: inputs.repair_excerpts_only != true
        run: node prepare-notification-queue.js

      - name: Audit every delivered article title and excerpt
        run: node tool/audit-article-text.js
        env:
          ARTICLE_TEXT_REQUIRE_COMPLETE: '1'

      - name: Configure Git
        run: |
          git config --global user.name 'SCP Crawler Bot'
          git config --global user.email 'scp-crawler@github-actions.bot'

      - name: Commit and push results
        run: |
          git add local-data/ tag-dictionary.json tag-translations-pending.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update SCP data - $(date -u +%Y%m%d%H%M%S)"
            # Fail on competing writes; never overwrite notification state via rebase.
            git push origin master
          fi
