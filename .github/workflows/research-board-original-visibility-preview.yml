name: Preview hide missing-original works without deleting catalog data
on:
  push:
    branches: [fix/hide-non-catalog-originals-20261124]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=5500
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Visibility-policy regression tests
        run: node --test test/research-board-original-availability.test.js
      - name: Rebuild from official catalog and inspect exactly which work IDs are hidden
        run: node tool/preview-research-board-origin-fix.js preview-missing-original-visibility
      - name: Enforce non-destructive graph visibility policy
        run: |
          node - <<'NODE'
          const fs=require('fs'),zlib=require('zlib'),assert=require('assert/strict');
          const p='preview-missing-original-visibility/';
          const b=JSON.parse(zlib.gunzipSync(fs.readFileSync(p+'preview-board.json.gz')));
          const s=JSON.parse(fs.readFileSync(p+'SUMMARY.json'));
          const ids=b.hiddenOriginalUnavailableNodeIds||[];
          assert(ids.length>0,'No work IDs to suppress');
          assert.equal(new Set(ids).size,ids.length,'Duplicate hidden node ID');
          assert(ids.every(x=>Number.isInteger(x)&&x>=0&&x<b.nodes.length),'Hidden node missing');
          assert.equal(b.overview.hiddenOriginalUnavailableWorkCount,ids.length);
          const moved=fs.readFileSync(p+'moved-page-owners.csv','utf8').trim().split(/\\r?\\n/).slice(1);
          const reviewed='https://scp-vn.wikidot.com/scp-179';
          const owners=new Map(b.nodes.flatMap(n=>n[13].map(v=>[v[1],n[14][0]])));
          assert.deepEqual(moved.map(line=>line.slice(1).split('"')[0]),[reviewed],
            'Only the independently verified Vietnamese alias may move');
          assert.equal(owners.get(reviewed),owners.get('https://lafundacionscp.wikidot.com/scp-es-026'));
          assert.notEqual(owners.get(reviewed),owners.get('https://lafundacionscp.wikidot.com/scp-es-179'));
          assert.equal(s.movedPages,1);
          assert.equal(s.addedEdges,0,'No new unrelated relation edges');
          assert.equal(s.removedEdges,7,'Only the seven newly internal links may disappear');
          assert.equal(s.pageCountAfter,125100,'Catalog page coverage changed');
          assert.equal(s.validated,true,'Graph proof validation failed');
          console.log(JSON.stringify({revision:b.revision,hiddenWorks:ids.length,catalogPages:s.pageCountAfter,
            workNodes:b.nodes.length,edges:b.edges.length,moved:s.movedPages},null,2));
          NODE
      - name: Upload full read-only preview and work-ID proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: missing-original-visibility-preview-${{ github.run_id }}
          path: preview-missing-original-visibility/
          retention-days: 14
          if-no-files-found: warn
