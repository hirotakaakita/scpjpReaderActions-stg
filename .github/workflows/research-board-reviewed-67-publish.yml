name: Stage validated all-67 work repaired research board
on:
  pull_request:
    branches: [master]
    paths:
      - 'tool/prepare-all-reviewed-work-publication.js'
      - '.github/workflows/research-board-reviewed-67-publish.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  package:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/research-board-all-reviewed-identities-20261124' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=5500
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test test/research-board-reviewed-150-work-repairs.test.js test/research-board-reviewed-transitive-identity-proof.test.js
      - name: Rebuild 125100 published article identities with reviewed fixes
        run: node tool/preview-research-board-origin-fix.js preview-all-67-reviewed
      - name: Download verified all-150 independent original/edition audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p original-150-artifact
          gh run download 45316009381 --repo "$GITHUB_REPOSITORY" --name catalogue-original-150-evidence-45316009381 --dir original-150-artifact
      - name: Verify all 67 merges and 43 legitimate distinct works, then package
        run: node tool/prepare-all-reviewed-work-publication.js preview-all-67-reviewed original-150-artifact/FINAL-150.json
      - name: Verify the exact repackaged STG graph against full raw catalog
        run: node research-board/validate.js
      - name: Run all Node regression checks before staging distribution
        run: node --test
      - name: Commit exact validated gzip and manifest only to review PR branch
        run: |
          FILE=$(node -p "require('./local-data/mobile-v3/research-board/manifest.json').fileName")
          git add -f local-data/mobile-v3/research-board/manifest.json "local-data/mobile-v3/research-board/$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Stage 67 publisher-reviewed research-board identity repairs"
            git fetch origin fix/research-board-all-reviewed-identities-20261124
            git rebase origin/fix/research-board-all-reviewed-identities-20261124
            git push origin HEAD:fix/research-board-all-reviewed-identities-20261124
          fi
      - name: Upload complete review evidence and graph diff
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-reviewed-67-proof-${{ github.run_id }}
          path: preview-all-67-reviewed/
          retention-days: 21
          if-no-files-found: warn
